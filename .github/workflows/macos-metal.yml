name: Build macOS Metal
run-name: ${{ github.event.pull_request && format('{0} -> {1} by {2} (PR {3})', github.head_ref, github.base_ref, github.actor, github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('{0} by {1} [manual]', github.ref_name, github.actor) || format('{0} by {1}', github.ref_name, github.actor) }}

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build-type: [ Release ]
        enable-glfw: [ GLFW=ON, GLFW=OFF ]
        enable-imgui: [ IMGUI=ON, IMGUI=OFF ]
        build-examples: [ EXAMPLES=ON, EXAMPLES=OFF ]

        exclude:
          - build-examples: EXAMPLES=ON
            enable-glfw: GLFW=OFF
          - build-examples: EXAMPLES=ON
            enable-imgui: IMGUI=OFF

          - build-examples: EXAMPLES=OFF
            enable-glfw: GLFW=ON
          - build-examples: EXAMPLES=OFF
            enable-imgui: IMGUI=ON

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S ${{ github.workspace }} -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DGFX_BUILD_METAL=ON
          -DGFX_BUILD_VULKAN=OFF
          -DGFX_BUILD_GLFW_INTEGRATION=${{ matrix.enable-glfw == 'GLFW=ON' && 'ON' || 'OFF' }}
          -DGFX_BUILD_IMGUI_INTEGRATION=${{ matrix.enable-imgui == 'IMGUI=ON' && 'ON' || 'OFF' }}
          -DGFX_BUILD_${{ matrix.build-examples }}
          -DGFX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      - name: Test
        run: ctest --test-dir build
